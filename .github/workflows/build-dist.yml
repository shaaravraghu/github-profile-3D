name: Build dist

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Commit updated dist
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist
          if git diff --cached --quiet; then
            echo "dist is already up to date"
          else
            git commit -m "chore: rebuild dist from src"
            git push
          fi
